[package]
name = "hr-docker-builder"
version = "0.1.8"
description = "HR Docker 批量构建工具 / Batch Docker image builder"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt", "rt-multi-thread", "macros", "sync", "time", "io-util"] }
chrono = "0.4"

[profile.release]
strip = true
lto = true
